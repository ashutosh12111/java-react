# Base configuration shared by every environment. Profile files only override what differs.
# Secrets are NEVER placed here: they arrive through environment variables / a secrets manager.
spring:
  application:
    name: master-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness (used by Docker/Kubernetes later).
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  service:
    name: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# Downstream services. URLs are injected per environment; timeouts are sized per service.
# Connect timeouts are short (an unreachable host should fail fast); read timeouts follow expected latency.
platform:
  openapi:
    description: "Orchestrates multi-service workflows, aggregates responses and handles partial failures. Owns no business data."
  downstream:
    user:
      base-url: ${USER_SERVICE_URL:http://localhost:8082}
      read-timeout: 2s
    product:
      base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
      read-timeout: 2s
    inventory:
      base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
      read-timeout: 3s
    order:
      base-url: ${ORDER_SERVICE_URL:http://localhost:8085}
      read-timeout: 3s
    payment:
      base-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
      # Payment providers are slow; timing out early only creates more "outcome unknown" cases.
      read-timeout: 10s
    notification:
      base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
      read-timeout: 2s

logging:
  pattern:
    # Every log line carries the request's correlation ID (see CorrelationIdFilter).
    correlation: "[%X{correlationId:-}] "
