# Base configuration shared by every environment. Profile files only override what differs.
# Secrets are NEVER placed here: they arrive through environment variables / a secrets manager.
spring:
  application:
    name: notification-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness (used by Docker/Kubernetes later).
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  service:
    name: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

platform:
  openapi:
    description: "Email, SMS and push notification delivery."

logging:
  pattern:
    # Every log line carries the request's correlation ID (see CorrelationIdFilter).
    correlation: "[%X{correlationId:-}] "
